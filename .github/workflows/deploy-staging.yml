name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: sst deploy --stage staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-3

      - name: Install SST providers
        run: pnpm --filter infra exec sst install --stage staging

      - name: Build the Payload Lambda bundle
        run: pnpm --filter @dilm/cms build:open-next

      - name: Build the web Lambda bundle
        run: pnpm --filter @dilm/web build:open-next
        env:
          NEXT_PUBLIC_MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}

      - name: Deploy
        run: pnpm deploy:staging
        env:
          ADMIN_ALLOWED_IPS: ${{ vars.ADMIN_ALLOWED_IPS }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          SES_SHARED_SENDER: ${{ vars.SES_SHARED_SENDER }}
          SES_SHARED_SENDER_IDENTITY: ${{ vars.SES_SHARED_SENDER_IDENTITY }}

      - name: Apply Payload migrations
        run: scripts/ci/migrate-deployed.sh --stage staging
