name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Typecheck + sst diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install SST providers
        run: pnpm --filter infra exec sst install --stage staging

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-3

      - name: Build the Payload Lambda bundle
        run: pnpm --filter @dilm/cms build:open-next

      - name: Build the web Lambda bundle
        run: pnpm --filter @dilm/web build:open-next
        env:
          NEXT_PUBLIC_MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}

      - name: sst diff (staging)
        run: pnpm diff --stage staging
        env:
          ADMIN_ALLOWED_IPS: ${{ vars.ADMIN_ALLOWED_IPS || '192.0.2.1' }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          SES_SHARED_SENDER: ${{ vars.SES_SHARED_SENDER }}
          SES_SHARED_SENDER_IDENTITY: ${{ vars.SES_SHARED_SENDER_IDENTITY }}

  web-e2e:
    name: Web build + E2E smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect web changes
        id: scope
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/${BASE}...HEAD") || {
            echo "Could not diff against origin/${BASE}; running the web E2E smoke."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if printf '%s\n' "$files" | grep -qE '^(apps/web/|packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$|tsconfig[^/]*\.json$|eslint\.config\.[^/]+$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No web-related changes; skipping the web E2E smoke."
          fi

      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        if: steps.scope.outputs.run == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.scope.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @dilm/web exec playwright install --with-deps chromium

      - name: Install Chromium system libraries
        if: steps.scope.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @dilm/web exec playwright install-deps chromium

      - name: Build the web app and run the E2E smoke (fixture content, no AWS)
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @dilm/web test:e2e

      - name: Upload Playwright traces on failure
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore

  migrations:
    name: Payload migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload_app
          POSTGRES_PASSWORD: payload_app
          POSTGRES_DB: dilm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload_app -d dilm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      RUNTIME_CONFIG_SOURCE: env
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: dilm
      DATABASE_USER: payload_app
      DATABASE_PASSWORD: payload_app
      DATABASE_SSL: "false"
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      S3_PUBLIC_BUCKET: dilm-ci-public
      S3_PRIVATE_BUCKET: dilm-ci-cv-private
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply every migration to an empty database
        run: pnpm --filter @dilm/cms migrate

      - name: Fail if a collection changed without a migration
        run: |
          pnpm --filter @dilm/cms migrate:create uncommitted --skip-empty
          if [ -n "$(git status --porcelain apps/cms/src/migrations)" ]; then
            echo "::error::The collection config has changed but no migration was committed. Run 'pnpm --filter cms migrate:create <name>' and commit the files it writes."
            git status --porcelain apps/cms/src/migrations
            exit 1
          fi

      - name: Seed the starting site twice and run the revalidation tests on scratch databases
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: payload_app
          PGPASSWORD: payload_app
        run: apps/cms/scripts/test-seed-pages.sh
