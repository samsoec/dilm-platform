name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: sst deploy --stage production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-3

      # TODO(DILM-38): run `pnpm --filter @dilm/cms migrate` here, before the
      # new version goes live (Backend Spec §13), once Aurora and the AWS
      # runtime-config loader (DILM-12) exist for it to connect with.

      - name: Deploy
        run: pnpm deploy:production
