name: dilm

x-platform: &platform
  platform: ${DOCKER_PLATFORM:-linux/arm64}

services:
  postgres:
    <<: *platform
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_MASTER_PASSWORD:-postgres}
      APP_DB_NAME: ${DATABASE_NAME:-dilm}
      APP_DB_USER: ${DATABASE_USER:-payload_app}
      APP_DB_PASSWORD: ${DATABASE_PASSWORD:-payload_app}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DATABASE_NAME:-dilm}"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    <<: *platform
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-buckets:
    <<: *platform
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-dilm-local-public}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-dilm-local-cv-private}
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    volumes:
      - ./docker/minio:/scripts:ro
    restart: "no"

  mailpit:
    <<: *platform
    image: axllent/mailpit:v1.31.2
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "8025:8025"

  elasticmq:
    <<: *platform
    image: softwaremill/elasticmq-native:1.7.1
    profiles: ["queue"]
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  postgres-data:
  minio-data:
